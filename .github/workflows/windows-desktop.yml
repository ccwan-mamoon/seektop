name: SeekTop Windows

on:
  push:
    branches: [main]
    paths: [desktop/build.gradle.kts]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Windows package and matching source as a prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: seektop-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare verified browser runtime
        run: python desktop/provision-browser.py
      - name: Test JVM modules and check formatting
        run: ./gradlew.bat :desktop:jvmTest :shared:jvmTest :ui:jvmTest :designsys:jvmTest :richtext:jvmTest spotlessCheck --no-daemon --max-workers=4
      - name: Test session bridge without account sign-in
        run: python desktop/tests/test_browser.py
      - name: Build Windows app-image
        run: ./gradlew.bat :desktop:createDistributable --no-daemon --max-workers=4
      - name: Package app and matching source
        run: python desktop/package_release.py --app-dir desktop/build/compose/binaries/main/app/SeekTop --output-dir release
      - uses: actions/upload-artifact@v7
        with:
          name: SeekTop-0.3.0-windows-x64
          path: release/*
          if-no-files-found: error
      - name: Publish prerelease
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release create desktop-v0.3.0 release/SeekTop-0.3.0-windows-x64.zip release/SeekTop-0.3.0-source.zip release/SHA256SUMS.txt --target $env:GITHUB_SHA --prerelease --title "SeekTop 0.3.0 · 寻桌（Windows 预览版）" --notes-file desktop/RELEASE_NOTES.md
      - name: Stop Gradle
        if: always()
        run: ./gradlew.bat --stop

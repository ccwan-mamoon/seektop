name: SeekTop Windows

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Windows package and matching source
        required: true
        type: boolean
        default: false
      prerelease:
        description: Publish as a preview (requires preview updates enabled in SeekTop)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seektop-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Read desktop version
        shell: pwsh
        run: |
          $version = python -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["seektop"])'
          "SEEKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare verified browser runtime
        run: python desktop/provision-browser.py
      - name: Prepare verified installer compiler
        shell: pwsh
        run: ./desktop/provision-installer.ps1
      - name: Test JVM modules and check formatting
        run: ./gradlew.bat :desktop:jvmTest :shared:jvmTest :ui:jvmTest :designsys:jvmTest :richtext:jvmTest spotlessCheck --no-daemon --max-workers=4
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugins/network-tools/go.mod
          cache-dependency-path: plugins/network-tools/go.sum
      - name: Test independent network tool workers
        shell: pwsh
        run: |
          go -C plugins/network-tools test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python plugins/test_tools.py --build-with go --directory build/plugin-smoke
      - name: Test native external link routing
        run: python desktop/tests/test_link_router.py
      - name: Test native Windows updater
        run: python desktop/tests/test_updater.py
      - name: Test session bridge without account sign-in
        run: python desktop/tests/test_browser.py
      - name: Test Windows AI credential storage and streaming
        run: python desktop/tests/test_ai_browser.py
      - name: Test resumable update transfers
        run: node desktop/tests/test_update_transfer.cjs
      - name: Test isolated plugin downloads
        run: node desktop/tests/test_plugin_download.cjs
      - name: Test AI request isolation and streaming
        run: node desktop/tests/test_ai_analysis.cjs
      - name: Test native mail credential and request boundaries
        run: |
          node desktop/tests/test_seekli.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/tests/test_seekli_wire.cjs
      - name: Test isolated exchange rate requests
        run: node desktop/tests/test_exchange_rates.cjs
      - name: Test Windows Toast lifecycle
        run: node desktop/tests/test_notifications.cjs
      - name: Test release artifacts and installer lifecycle
        shell: pwsh
        run: |
          python desktop/tests/test_release_package.py --iscc "$env:SEEKTOP_ISCC"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python desktop/tests/test_installer.py --iscc "$env:SEEKTOP_ISCC"
      - name: Build Windows app-image
        run: ./gradlew.bat :desktop:createDistributable --no-daemon --max-workers=4
      - name: Check packaged Java modules and native SQLite
        run: python desktop/tests/test_packaged_runtime.py --app-dir desktop/build/compose/binaries/main/app/SeekTop
      - name: Package app and matching source
        shell: pwsh
        run: python desktop/package_release.py --app-dir desktop/build/compose/binaries/main/app/SeekTop --output-dir release --iscc "$env:SEEKTOP_ISCC"
      - name: Report package components and duplicate files
        run: python desktop/package_report.py --app-dir desktop/build/compose/binaries/main/app/SeekTop --output release/PACKAGE-SIZE.json
      - uses: actions/upload-artifact@v7
        with:
          name: SeekTop-${{ env.SEEKTOP_VERSION }}-windows-x64
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = $env:SEEKTOP_VERSION
          $tag = "desktop-v$version"
          $assets = @("release/SeekTop-$version-windows-x64-setup.exe", "release/SeekTop-$version-windows-x64.zip", "release/SeekTop-$version-source.zip", "release/SHA256SUMS.txt")
          & gh release view $tag | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # Same-version rebuilds must move the tag as well as replace all matching assets.
            # The lease prevents overwriting a tag changed by somebody else during this run.
            $previousTagLine = & git ls-remote --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0 -or -not $previousTagLine) { throw "Cannot read existing release tag" }
            $previousTag = ($previousTagLine -split '\s+')[0]
            & git push "--force-with-lease=refs/tags/${tag}:$previousTag" origin "${env:GITHUB_SHA}:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Release tag changed; refusing to overwrite" }
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Release asset replacement failed" }
            & gh release edit $tag --target $env:GITHUB_SHA --title "SeekTop $version · 寻桌" --notes-file desktop/RELEASE_NOTES.md
          } else {
            $releaseArgs = @("release", "create", $tag) + $assets + @("--target", $env:GITHUB_SHA, "--title", "SeekTop $version · 寻桌", "--notes-file", "desktop/RELEASE_NOTES.md")
            if ('${{ inputs.prerelease }}' -eq 'true') { $releaseArgs += "--prerelease" }
            & gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed" }
      - name: Stop Gradle
        if: always()
        run: ./gradlew.bat --stop

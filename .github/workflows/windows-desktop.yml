name: SeekTop Windows

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Windows package and matching source as a prerelease
        required: true
        type: boolean
        default: false
      prerelease:
        description: Publish as a preview (requires preview updates enabled in SeekTop)
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seektop-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Read desktop version
        shell: pwsh
        run: |
          $version = python -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["seektop"])'
          "SEEKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare verified browser runtime
        run: python desktop/provision-browser.py
      - name: Test JVM modules and check formatting
        run: ./gradlew.bat :desktop:jvmTest :shared:jvmTest :ui:jvmTest :designsys:jvmTest :richtext:jvmTest spotlessCheck --no-daemon --max-workers=4
      - name: Test native Windows updater
        run: python desktop/tests/test_updater.py
      - name: Test session bridge without account sign-in
        run: python desktop/tests/test_browser.py
      - name: Build Windows app-image
        run: ./gradlew.bat :desktop:createDistributable --no-daemon --max-workers=4
      - name: Package app and matching source
        run: python desktop/package_release.py --app-dir desktop/build/compose/binaries/main/app/SeekTop --output-dir release
      - uses: actions/upload-artifact@v7
        with:
          name: SeekTop-${{ env.SEEKTOP_VERSION }}-windows-x64
          path: release/*
          if-no-files-found: error
      - name: Publish prerelease
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = $env:SEEKTOP_VERSION
          $releaseArgs = @("release", "create", "desktop-v$version", "release/SeekTop-$version-windows-x64.zip", "release/SeekTop-$version-source.zip", "release/SHA256SUMS.txt", "--target", $env:GITHUB_SHA, "--title", "SeekTop $version · 寻桌", "--notes-file", "desktop/RELEASE_NOTES.md")
          if ('${{ inputs.prerelease }}' -eq 'true') { $releaseArgs += "--prerelease" }
          & gh @releaseArgs
      - name: Stop Gradle
        if: always()
        run: ./gradlew.bat --stop

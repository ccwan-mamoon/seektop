name: Windows 问题反馈
description: SeekTop Windows 桌面版的可复现问题
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: SeekTop 版本
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows 版本与 CPU 架构
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、期望行为和实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图与经过脱敏的错误信息
      description: 不要上传 Cookie、密码、令牌或个人数据库。
